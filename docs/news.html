<header>

<div class="container">
    <main>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;">

            <button onclick="triggerRefresh()" style="background:var(--primary);color:white;border:none;padding:10px 20px;border-radius:50px;font-size:0.9em;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                🔄 Check for Updates
            </button>
        </div>

            <p style="margin:0;font-size:0.9em;color:var(--text-light);">📡 News fetched directly from <strong>TechCrunch AI</strong>, <strong>ArsTechnica AI</strong>, <strong>The Verge AI</strong>, and <strong>Hacker News</strong>. Click "Check for Updates" to refresh.</p>

<script>
// ===== RSS News Fetcher (Client-side, no server needed) =====

var NEWS_FEEDS = [
    'https://techcrunch.com/tag/artificial-intelligence/feed/',
    'https://arstechnica.com/tag/ai/feed/',
    'https://www.theverge.com/ai-artificial-intelligence/rss.xml',
    'https://hnrss.org/frontpage'
];

var FEED_NAMES = ['TechCrunch AI', 'ArsTechnica AI', 'The Verge AI', 'Hacker News'];

// Multiple CORS proxies (in order of reliability)
var PROXIES = [
    'https://api.rss2json.com/v1/api.json?rss_url=',
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?'
];

// ===== Helpers =====
function getCache() {
    try { return JSON.parse(localStorage.getItem('news_cache')); } catch(e) { return null; }
}
function setCache(data) {
    try { localStorage.setItem('news_cache', JSON.stringify(data)); } catch(e) {}
}
function escapeHtml(t) {
    var d = document.createElement('div');
    d.textContent = t || '';
    return d.innerHTML;
}

// ===== Fetch single feed with multiple proxy fallbacks =====
async function fetchFeed(url, name, proxyIdx) {
    if (proxyIdx === undefined) proxyIdx = 0;
    if (proxyIdx >= PROXIES.length) return [];

    try {
        var proxyUrl = PROXIES[proxyIdx] + encodeURIComponent(url);
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, 12000);
        var resp = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timer);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var text = await resp.text();
        var items = [];

        // rss2json returns JSON directly
        if (proxyIdx === 0) {
            var json = JSON.parse(text);
            if (json.items) {
                json.items.forEach(function(item) {
                    items.push({
                        title: item.title || '',
                        link: item.link || '',
                        summary: (item.description || '').replace(/<[^>]*>/g,'').substring(0,200),
                        date: item.pubDate || '',
                        source: name
                    });
                });
                return items;
            }
        }

        // Parse XML for other proxies
        var parser = new DOMParser();
        var xml = parser.parseFromString(text, 'text/xml');
        var xmlItems = xml.querySelectorAll('item');
        xmlItems.forEach(function(item) {
            var get = function(tag) {
                var el = item.querySelector(tag);
                return el ? el.textContent.trim() : '';
            };
            var title = get('title');
            var link = get('link');
            if (title && link) {
                items.push({
                    title: title,
                    link: link,
                    summary: get('description').replace(/<[^>]*>/g,'').substring(0,200),
                    date: get('pubDate'),
                    source: name
                });
            }
        });
        return items;
    } catch(e) {
        return await fetchFeed(url, name, proxyIdx + 1);
    }
}

// ===== Parse date (handle RSS format) =====
function parseDate(str) {
    if (!str) return new Date(0);
    var d = new Date(str);
    return isNaN(d.getTime()) ? new Date(0) : d;
}

function formatDate(d) {
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

// ===== Render news items =====
function renderNews(items) {
    if (!items || items.length === 0) {
        document.getElementById('news-container').innerHTML = '<div class="error-msg"><p>📭 No news found. Click "Check for Updates" to try again.</p></div>';
        return;
    }

    var latest = items[0];
    var older = items.slice(1);
    var html = '';

    // Sticky latest
    html += '<div class="sticky-news">';
    html += '<span class="label">⭐ Latest News</span>';
    html += '<h2><a href="' + escapeHtml(latest.link) + '" target="_blank" rel="noopener">' + escapeHtml(latest.title) + '</a></h2>';
    html += '<div class="meta">📅 ' + formatDate(parseDate(latest.date)) + ' · <span class="source">' + escapeHtml(latest.source) + '</span></div>';
    if (latest.summary) html += '<p>' + escapeHtml(latest.summary) + '</p>';
    html += '</div>';

    // Older
    html += '<h2 style="margin-top:30px;">📋 More News</h2>';
    html += '<div class="news-list">';
    older.forEach(function(item) {
        html += '<div class="news-item">';
        html += '<div class="date">📅 ' + formatDate(parseDate(item.date)) + ' <span class="source">' + escapeHtml(item.source) + '</span></div>';
        html += '<h3><a href="' + escapeHtml(item.link) + '" target="_blank" rel="noopener">' + escapeHtml(item.title) + '</a></h3>';
        if (item.summary) html += '<p>' + escapeHtml(item.summary) + '</p>';
        html += '</div>';
    });
    html += '</div>';

    document.getElementById('news-container').innerHTML = html;
}

// ===== Fetch all feeds =====
async function fetchAll(showLoading) {
    var updateEl = document.getElementById('last-updated');
    if (showLoading) {
        document.getElementById('news-container').innerHTML = '<div class="loading"><div class="spinner"></div><p>Fetching latest AI news...</p></div>';
    }

    var allItems = [];
    var successCount = 0;

    for (var i = 0; i < NEWS_FEEDS.length; i++) {
        try {
            var items = await fetchFeed(NEWS_FEEDS[i], FEED_NAMES[i]);
            allItems = allItems.concat(items);
            successCount++;
            if (showLoading) {
                updateEl.innerHTML = '⏳ ' + successCount + '/' + NEWS_FEEDS.length + ' sources loaded (' + allItems.length + ' items)';
            }
        } catch(e) {
            successCount++;
        }
    }

    // Sort by date descending
    allItems.sort(function(a, b) {
        return parseDate(b.date).getTime() - parseDate(a.date).getTime();
    });

    // Dedup by URL
    var seen = {};
    allItems = allItems.filter(function(item) {
        if (seen[item.link]) return false;
        seen[item.link] = true;
        return true;
    });

    // Keep max 60
    allItems = allItems.slice(0, 60);

    if (allItems.length === 0) {
        if (showLoading) {
            document.getElementById('news-container').innerHTML = '<div class="error-msg"><p>⚠️ Could not fetch news.</p><p style="font-size:0.85em;color:var(--text-light);margin-top:8px;">Try again later or check your network connection.</p></div>';
            updateEl.innerHTML = '❌ Fetch failed. Try again.';
        }
        return;
    }

    // Cache
    var now = new Date();
    var cacheData = {
        updated: now.toISOString().substring(0, 19).replace('T', ' '),
        items: allItems
    };
    setCache(cacheData);

    updateEl.innerHTML = '✅ ' + allItems.length + ' stories from ' + successCount + ' sources · <a href="javascript:triggerRefresh()" style="color:var(--primary);">🔄 Refresh</a>';
    renderNews(allItems);
}

// ===== Entry points =====
function loadNews() {
    var updateEl = document.getElementById('last-updated');
    var cached = getCache();
    if (cached && cached.items && cached.items.length > 0) {
        updateEl.innerHTML = '📡 Cached: ' + cached.updated + ' · <a href="javascript:triggerRefresh()" style="color:var(--primary);">🔄 Check for Updates</a>';
        renderNews(cached.items);
        // Background refresh
        setTimeout(function() { fetchAll(true); }, 1000);
    } else {
        fetchAll(true);
    }
}

function triggerRefresh() {
    var btn = document.querySelector('button[onclick="triggerRefresh()"]');
    btn.innerHTML = '⏳ Fetching...';
    btn.disabled = true;
    btn.style.opacity = '0.6';
    fetchAll(true).then(function() {
        btn.innerHTML = '✅ Done!';
        setTimeout(function() {
            btn.innerHTML = '🔄 Check for Updates';
            btn.disabled = false;
            btn.style.opacity = '1';
        }, 2000);
    });
}

loadNews();
</script>
