<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Arial,sans-serif"><title id="t">Web chat vs WorkBuddy-agent scores on the same breast-cancer case</title><desc id="d">Three models tested as plain web chat versus inside the WorkBuddy agent on an identical anonymized post-operative breast cancer case, scored 0-100 with a 16-item rubric against 2026 CBCS guidelines. GLM 5.2 rose 5 to 44, DeepSeek V4 Flash 28 to 34, Kimi K2.6 37 to 46.</desc><rect width="780" height="430" fill="#ffffff"/><line x1="64" y1="354.0" x2="756" y2="354.0" stroke="#e2e8f0"/><text x="56" y="358.0" text-anchor="end" font-size="12" fill="#64748b">0</text><line x1="64" y1="296.0" x2="756" y2="296.0" stroke="#e2e8f0"/><text x="56" y="300.0" text-anchor="end" font-size="12" fill="#64748b">10</text><line x1="64" y1="238.0" x2="756" y2="238.0" stroke="#e2e8f0"/><text x="56" y="242.0" text-anchor="end" font-size="12" fill="#64748b">20</text><line x1="64" y1="180.0" x2="756" y2="180.0" stroke="#e2e8f0"/><text x="56" y="184.0" text-anchor="end" font-size="12" fill="#64748b">30</text><line x1="64" y1="122.0" x2="756" y2="122.0" stroke="#e2e8f0"/><text x="56" y="126.0" text-anchor="end" font-size="12" fill="#64748b">40</text><line x1="64" y1="64.0" x2="756" y2="64.0" stroke="#e2e8f0"/><text x="56" y="68.0" text-anchor="end" font-size="12" fill="#64748b">50</text><text x="64" y="26" font-size="15" font-weight="700" fill="#1e293b">Web chat vs Agent wrapper — same case, 0–100</text><rect x="104.1" y="325.0" width="69.2" height="29.0" fill="#cbd5e1"/><text x="138.7" y="319.0" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">5</text><rect x="185.3" y="98.8" width="69.2" height="255.2" fill="url(#g)"/><text x="219.9" y="92.8" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">44</text><text x="179.3" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">GLM 5.2</text><rect x="334.8" y="191.6" width="69.2" height="162.4" fill="#cbd5e1"/><text x="369.4" y="185.6" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">28</text><rect x="416.0" y="156.8" width="69.2" height="197.2" fill="url(#g)"/><text x="450.6" y="150.8" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">34</text><text x="410.0" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">DeepSeek V4 Flash</text><rect x="565.5" y="139.4" width="69.2" height="214.6" fill="#cbd5e1"/><text x="600.1" y="133.4" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">37</text><rect x="646.7" y="87.2" width="69.2" height="266.8" fill="url(#g)"/><text x="681.3" y="81.2" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">46</text><text x="640.7" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Kimi K2.6</text><rect x="530" y="40" width="14" height="14" fill="#cbd5e1"/><text x="550" y="52" font-size="12" fill="#64748b">Web chat</text><rect x="650" y="40" width="14" height="14" fill="#ef4444"/><text x="670" y="52" font-size="12" fill="#ef4444">WorkBuddy agent</text><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient></defs></svg>