<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Arial,sans-serif"><title id="t">Benchmark methodology: one case, one rubric, two wrappers</title><desc id="d">An anonymized post-operative breast cancer case is scored with a 16-item rubric against 2026 CBCS guidelines (0-100). The same case is run twice: as a plain web chat and inside the WorkBuddy agent, so the only variable is the wrapper.</desc><rect width="820" height="300" fill="#ffffff"/><rect x="30" y="40" width="210" height="80" rx="10" fill="#1e293b"/><text x="135" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Anonymized</text><text x="135" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">post-op breast</text><text x="135" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">cancer case</text><rect x="320" y="40" width="250" height="80" rx="10" fill="#6366f1"/><text x="445" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">16-item rubric</text><text x="445" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">vs 2026 CBCS</text><text x="445" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">guidelines</text><rect x="620" y="40" width="170" height="80" rx="10" fill="#10b981"/><text x="705" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">0–100</text><text x="705" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">score</text><rect x="330" y="180" width="230" height="64" rx="10" fill="#94a3b8"/><text x="445" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Web chat leg</text><text x="445" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">(plain web UI)</text><rect x="580" y="180" width="230" height="64" rx="10" fill="#f59e0b"/><text x="695" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Agent leg</text><text x="695" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">(WorkBuddy)</text><line x1="240" y1="80" x2="320" y2="80" stroke="#1e293b" stroke-width="2" marker-end="url(#ar)"/><line x1="570" y1="80" x2="620" y2="80" stroke="#1e293b" stroke-width="2" marker-end="url(#ar)"/><line x1="445" y1="180" x2="445" y2="120" stroke="#1e293b" stroke-width="2" marker-end="url(#ar)"/><line x1="695" y1="180" x2="695" y2="120" stroke="#1e293b" stroke-width="2" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1e293b"/></marker></defs></svg>