<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui,Segoe UI,Arial,sans-serif"><title id="t">Agent-wrapper lift (Δ = agent score − web score), points / 100</title><desc id="d">The agent wrapper raises the floor, not the ceiling. GLM 5.2 gained +39 points, Kimi K2.6 +9, DeepSeek V4 Flash only +6 — the higher the web baseline, the smaller the wrapper lift.</desc><rect width="780" height="380" fill="#ffffff"/><line x1="64" y1="304.0" x2="756" y2="304.0" stroke="#e2e8f0"/><text x="56" y="308.0" text-anchor="end" font-size="12" fill="#64748b">+0</text><line x1="64" y1="222.7" x2="756" y2="222.7" stroke="#e2e8f0"/><text x="56" y="226.7" text-anchor="end" font-size="12" fill="#64748b">+15</text><line x1="64" y1="141.3" x2="756" y2="141.3" stroke="#e2e8f0"/><text x="56" y="145.3" text-anchor="end" font-size="12" fill="#64748b">+30</text><line x1="64" y1="60.0" x2="756" y2="60.0" stroke="#e2e8f0"/><text x="56" y="64.0" text-anchor="end" font-size="12" fill="#64748b">+45</text><text x="64" y="26" font-size="15" font-weight="700" fill="#1e293b">Agent wrapper lift (Δ), points / 100</text><rect x="121.7" y="92.5" width="115.3" height="211.5" fill="url(#g2)"/><text x="179.3" y="84.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">+39</text><text x="179.3" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">GLM 5.2</text><rect x="352.3" y="271.5" width="115.3" height="32.5" fill="url(#g2)"/><text x="410.0" y="263.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">+6</text><text x="410.0" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">DeepSeek V4 Flash</text><rect x="583.0" y="255.2" width="115.3" height="48.8" fill="url(#g2)"/><text x="640.7" y="247.2" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">+9</text><text x="640.7" y="326" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Kimi K2.