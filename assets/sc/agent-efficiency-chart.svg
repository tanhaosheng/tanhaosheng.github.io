<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" font-family="system-ui,-apple-system,sans-serif" role="img" aria-label="Time saved by WorkBuddy Agent on real research tasks, three cases">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="manual" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6c3ce1"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="480" fill="url(#bg)"/>

  <text x="460" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Research hours I got back, three tasks at a glance</text>
  <text x="460" y="64" text-anchor="middle" font-size="13" fill="#64748b">Manual workflow vs. one WorkBuddy Hy3 agent run, per task. Lower is faster.</text>

  <!-- Y axis -->
  <g font-size="11" fill="#64748b">
    <line x1="160" y1="370" x2="880" y2="370" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="374" text-anchor="end">0 h</text>
    <text x="150" y="314" text-anchor="end">4 h</text>
    <text x="150" y="254" text-anchor="end">8 h</text>
    <text x="150" y="194" text-anchor="end">12 h</text>
    <text x="150" y="134" text-anchor="end">16 h</text>
    <line x1="160" y1="310" x2="880" y2="310" stroke="#e2e8f0" stroke-dasharray="2 4"/>
    <line x1="160" y1="250" x2="880" y2="250" stroke="#e2e8f0" stroke-dasharray="2 4"/>
    <line x1="160" y1="190" x2="880" y2="190" stroke="#e2e8f0" stroke-dasharray="2 4"/>
    <line x1="160" y1="130" x2="880" y2="130" stroke="#e2e8f0" stroke-dasharray="2 4"/>
  </g>

  <!-- Bars: 3 groups; group width 220; x-centers: 270, 500, 730 -->
  <!-- Manual heights (px from baseline 370, scale 15 px/h): Case1 12h -> 180, Case2 10h -> 150, Case3 14h -> 210 -->
  <!-- Agent heights: Case1 0.3h -> 4.5 ~ 5, Case2 0.07h -> 1, Case3 0.25h -> 4 -->
  <g filter="url(#sh)">
    <rect x="200" y="190" width="60" height="180" fill="url(#manual)" rx="6"/>
    <rect x="270" y="365" width="60" height="5"   fill="url(#agent)" rx="3"/>
    <rect x="430" y="220" width="60" height="150" fill="url(#manual)" rx="6"/>
    <rect x="500" y="369" width="60" height="1"   fill="url(#agent)" rx="3"/>
    <rect x="660" y="160" width="60" height="210" fill="url(#manual)" rx="6"/>
    <rect x="730" y="366" width="60" height="4"   fill="url(#agent)" rx="3"/>
  </g>

  <!-- Value labels on bars -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="230" y="180" fill="#1f2937">12 h</text>
    <text x="300" y="358" fill="#4f2db5">18 min</text>
    <text x="460" y="210" fill="#1f2937">10 h</text>
    <text x="530" y="362" fill="#4f2db5">~4 min</text>
    <text x="690" y="150" fill="#1f2937">14 h</text>
    <text x="760" y="358" fill="#4f2db5">~15 min</text>
  </g>

  <!-- Group labels (task names) -->
  <g font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="265" y="395">Task 1 · Reading data</text>
    <text x="495" y="395">Task 2 · Mismatch check</text>
    <text x="725" y="395">Task 3 · Forward plan</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="265" y="412">identify the preparation</text>
    <text x="495" y="412">wrong-paper trap test</text>
    <text x="725" y="412">originate a research plan</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#1f2937">
    <rect x="600" y="430" width="14" height="14" fill="url(#manual)" rx="3"/>
    <text x="620" y="441">Manual: my normal workflow for this task</text>
    <rect x="200" y="430" width="14" height="14" fill="url(#agent)" rx="3"/>
    <text x="220" y="441">WorkBuddy Hy3 agent, one shot</text>
  </g>

  <!-- Footnote -->
  <text x="460" y="465" text-anchor="middle" font-size="10.5" fill="#94a3b8">Manual times are my own estimate for the same task in my normal R/Python workflow. Agent times are wall-clock from prompt to final report. One shot each.</text>
</svg>