<h1>在 WorkBuddy 中配置 Agnes：免费智能体模型（稍慢但可用）—— 实操指南</h1>
<div class="article-byline">By <a href="https://tanhaosheng.asia/zh/about">谭好升</a> · 副主任医师 / 医学博士 (Associate Chief Physician, MD/PhD) · 甲状腺乳腺外科 (Thyroid &amp; Breast Surgery), 泰州市人民医院 (Taizhou People's Hospital) · 最后更新 2026-07-29</div>
<div class="series-badge">⚙️ 工作流 #1 / 3 · 配置指南 1 of 3</div>

<div class="box blue">
<strong>简短回答：</strong>Agnes 提供了一个免费的 API 访问模型，实际上可以用于日常任务，唯一的缺点是它的响应速度比付费方案稍慢。如果你预算有限或想要尝试而不花钱，Agnes 是一个不错的选择。它不仅可以用于网页界面，还可以通过 API 调用在程序中直接使用，这对开发者来说特别有价值。关键是在 WorkBuddy 中正确配置它，特别是模型名称。
</div>

<h2>为什么写这篇指南</h2>
<p>许多 AI 用户都在寻找免费模型，而且在质量上不要太妥协。Agnes 符合这个需求——它是真正的免费，而且对于大多数日常任务的输出结果足够好。唯一真正的缺点就是响应速度。本指南一步步带你完成 WorkBuddy 中的配置过程，让你不会踩到常见的坑。</p>
<p><strong>关键特性：</strong>Agnes 定位为 API 驱动的 AI 服务——你可以完全通过 API 调用它，而不仅仅是通过网页界面。这使得它特别适合需要把 AI 能力集成到自己的工作流或应用程序中的用户，而且 API 调用也是免费的。</p>

<div class="cta-box" style="background:linear-gradient(135deg,#dbeafe,#bfdbfe);border-left:5px solid #2563eb;padding:18px 22px;border-radius:8px;margin:18px 0;">
  <div style="font-size:1.1em;font-weight:700;color:#1e3a8a;margin-bottom:6px;">📋 开始之前</div>
  <p style="margin:0 0 8px 0;">本教程是在 <strong>WorkBuddy 内部</strong> 添加 Agnes 模型，所以你需要先装好 WorkBuddy 并登录。它是免费的：</p>
  <a href="https://workbuddy.cn" target="_blank" rel="noopener" style="font-size:1.05em;color:#1d4ed8;text-decoration:underline;word-break:break-all;">⬇️ 下载 WorkBuddy → workbuddy.cn</a>
  <!-- AFFILIATE SLOT (WorkBuddy) -->
</div>

<h2>第一步：在 Agnes 注册并获取 API Key</h2>
<p>访问 Agnes 平台，注册或登录你的账号。支持邮箱注册，也可以用 Google / GitHub 一键登录：</p>

<div class="cta-box" style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:5px solid #f59e0b;padding:18px 22px;border-radius:8px;margin:18px 0;">
  <div style="font-size:1.15em;font-weight:700;color:#7c2d12;margin-bottom:8px;">👉 Agnes 官网 / 注册登录入口</div>
  <a href="https://platform.agnes-ai.com/login" target="_blank" rel="noopener" style="font-size:1.05em;color:#1d4ed8;text-decoration:underline;word-break:break-all;">https://platform.agnes-ai.com/login</a>
</div>

<p>登录页面支持邮箱注册，也可以用 Google 和 GitHub 一键登录：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/agnes-login.png" alt="Agnes 登录注册页：邮箱密码字段、Google 和 GitHub 一键登录按钮" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<p>登录后，在左侧菜单进入 <strong>设置 → API 密钥</strong>：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/agnes-api-key-page.png" alt="Agnes 仪表板：设置 → API 密钥页面，红圈标注「创建新的密钥」按钮" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<p>点黑色的 <strong>"创建新的密钥"</strong> 按钮，弹出小窗让你填一个名称：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/agnes-create-key.png" alt="创建新密钥弹窗：名称字段，红字标注「any name is OK」（名字随便取）" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<p><strong>名字随便取，名字本身不影响功能</strong>。你可以写成 <code>workbuddy</code>、<code>my-laptop</code> 或 <code>家里台式机</code>，只要能帮你记起这把 key 是用在哪台设备就行。然后点 <strong>保存</strong>。</p>

<p>Agnes 会一次性把生成好的完整 key 显示给你看（中间自动用马赛克遮挡），右侧有复制图标。立刻把它复制下来，存进密码管理器或加密备忘里：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/agnes-copy-key.png" alt="生成的 API key 一次性显示，中间被打码，右侧红圈标注复制按钮" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<div class="warn-box" style="background:#fee2e2;border-left:5px solid #dc2626;padding:14px 18px;border-radius:8px;margin:18px 0;"><strong>⚠️ 重要提醒：</strong>完整 key 只在这一刻显示一次。如果你没复制就关了弹窗，需要删掉旧的、重新生成一把新的。也别把它贴进公开聊天或提交到公开仓库——等同于密码处理。</div>

<p style="text-align:center;color:#6b7280;font-size:.85em;"><em>第一步回顾：访问 platform.agnes-ai.com/login → 登录 → 设置 → API 密钥 → 创建新密钥（名字随便取） → 保存 → 复制 key。</em></p>

<h2>这个 API Key 是干什么的——以及最省事的使用方式</h2>
<p>拿到 API Key 之后，你其实有两种方式来驱动 Agnes：</p>
<ul>
  <li><strong>直接调用 API</strong>——你完全可以用终端或自己的脚本（比如 <code>curl</code> / Python / bash shell）直接打这个接口。这条路走得通，也能拿到最原始的编程控制权，每个请求都自己掌控。</li>
  <li><strong>让智能体替你调用</strong>——这才是 Agnes 真正好用的地方。配置进 WorkBuddy（第二步、第三步）之后，你只要开个对话、选 <code>agnes-2.0-flash</code>，<strong>智能体</strong>就会在背后帮你完成 API 调用、工具调用、多轮推理。</li>
</ul>
<div class="note"><strong>💡 一句话总结：</strong>确实，你<em>可以</em>用 bash 或任何终端去调 Agnes 的 API。但对于日常写东西、查资料、写代码、跑多步骤任务，<strong>智能体才是最好用的前端</strong>——免费 API 的好处你全拿到，却一行集成代码都不用写。</div>

<h2>第二步：在 WorkBuddy 中配置自定义模型</h2>
<p>登录 WorkBuddy，点聊天输入框右下角的 <strong>"Auto"</strong> 选择器。整个配置走 5 小步：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/workbuddy-step1-auto-dropdown.png" alt="WorkBuddy 聊天窗口：右下角红圈标注「Auto」选择器" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<p>下拉列表打开，滚到最底，点 <strong>"Configure custom models"</strong>：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/workbuddy-step2-configure-custom.png" alt="WorkBuddy 模型下拉：Auto / Hy3 / GLM-5.2 / GLM-5.1 / GLM-5v-Turbo / MiniMax-M3 / Kimi-K3 / Kimi-K2.7-Code……最底部「Configure custom models」用红圈标出" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<p><strong>Add Model（添加模型）</strong>弹窗打开。注意顶部那个小徽章：<em>OpenAI-compatible API required</em>（要求 OpenAI 兼容 API）。默认 <strong>Provider</strong> 是腾讯云 Token Plan，但 Agnes 不在预置列表里——所以要把 Provider 下拉<strong>滚到最底</strong>，选 <strong>Custom</strong>：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/workbuddy-step3-add-model-default.png" alt="添加模型弹窗：顶部「OpenAI-compatible API required」徽章，Provider 默认「腾讯云 Token Plan / 通用 Token Plan（个人版）」用红箭头指出" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<p>在 Provider 下拉里，划过所有预置服务（Kimi Coding Plan / GLM / Kimi China / MiniMax China / DeepSeek / Ollama ……）。一直到最底部 <em>Other</em> 分组下面那个 <strong>Custom</strong>（红圈标出）：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/workbuddy-step4-provider-custom.png" alt="Provider 下拉：Coding Plan（Kimi Coding Plan）、Custom API（GLM Open Platform / GLM API / Kimi China / MiniMax China / DeepSeek / Ollama）、Other — Custom 在最底部，红圈标出" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<p><strong>提醒：</strong>千万别图省事选个名字像的（比如"GLM Open Platform"、"MiniMax China"）——只有 <strong>Custom</strong> 允许你填自己的 Endpoint + Model Name，其他选项都会把你锁死到对应厂商的预设模型列表上。</p>

<p>点完 Custom，完整的表单出现。下面这三个字段一定要按截图填：</p>

<p style="text-align:center;margin:14px 0;"><img src="/assets/workbuddy-step5-custom-form.png" alt="Custom 表单已填写：Provider=Custom，Endpoint=https://apihub.agnes-ai.com/v1，API Key 字段，Model Name=agnes-2.0-flash 用红框标出，外加 Advanced Settings（Tool Calling / Image Input / Reasoning / Custom Protocol）和 Input/Output 滑动条" style="max-width:100%;height:auto;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);" loading="lazy"></p>

<ul>
  <li><strong>Provider：</strong> Custom（已在上面选好）</li>
  <li><strong>Endpoint：</strong> <code>https://apihub.agnes-ai.com/v1</code>——这是 Agnes 的 OpenAI 兼容 API 基础地址，原样复制，包括末尾的 <code>/v1</code>。</li>
  <li><strong>API Key：</strong> 从第一步复制的那串 <code>sk-</code> 开头的 key，粘贴进来。</li>
  <li><strong>Model Name：</strong> <code>agnes-2.0-flash</code>——<strong>至关重要</strong>，区分大小写，照抄。错填（比如 <code>agnes-2.0-flashx</code>、<code>Agnes-2.0-Flash</code>、<code>AGNES-2.0-FLASH</code>、<code>agnes-2-flash</code> 等等），调用就会报 404 / model not found / 无响应。</li>
</ul>

<div class="note" style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:4px;margin:14px 0;"><strong>🌏 中国大陆用户注意：</strong>如果你在中国大陆，请把 Endpoint 换成国内镜像节点——<code>https://apihub.agnes-ai.cn/v1/chat/completions</code>。默认的 <code>.com/v1</code> 节点在中国大陆境内会报连接超时或无法访问的错误。请严格按照上面的 <code>.cn</code> 地址填写，包括完整的 <code>/v1/chat/completions</code> 后缀。</div>

<div class="warn-box" style="background:#fee2e2;border-left:5px solid #dc2626;padding:14px 18px;border-radius:8px;margin:18px 0;"><strong>⚠️ 模型名三个最容易踩的坑：</strong>
<ol style="margin:6px 0 0 18px;">
  <li>大小写错误——正确的是全小写 + 数字 + 点 + 横杠，<strong>没有任何大写字母</strong>。</li>
  <li>漏掉 <code>.0</code>——常见的错误是写成 <code>agnes-2-flash</code>，<code>2</code> 和 <code>flash</code> 之间必须有点零。</li>
  <li>画蛇添足加后缀——比如 <code>agnes-2.0-flashx</code>、<code>agnes-2.0-flash-v2</code>。别发挥，照搬就行。</li>
</ol>
</div>

<div class="success-box" style="background:#d1fae5;border-left:5px solid #059669;padding:14px 18px;border-radius:8px;margin:18px 0;"><strong>速记卡片——可以直接复制：</strong>
<pre style="background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:8px;margin:8px 0;font-size:0.95em;line-height:1.5;">Provider : Custom
Endpoint : https://apihub.agnes-ai.com/v1          （中国大陆请改用：https://apihub.agnes-ai.cn/v1/chat/completions）
API Key  : sk-...（从第一步粘贴）
Model    : agnes-2.0-flash   &lt;-- 严格区分大小写，一字不差</pre>
</div>

<p>Advanced Settings（Tool Calling / Image Input / Reasoning / Custom Protocol）保持默认即可，除非你明确需要某一项；输入/输出 Token 上下文也保持默认。点 <strong>Save</strong>，就完成了。</p>

<p style="text-align:center;color:#6b7280;font-size:.85em;"><em>第二步回顾：Auto → Configure custom models → Add Model → Provider 选 Custom → 填 Endpoint / API Key / Model Name（<code>agnes-2.0-flash</code>）→ Save。</em></p>

<h2>常见错误要避免</h2>
<ul>
  <li><strong>模型名称错误：</strong>再次强调，<code>agnes-2.0-flash</code> 必须完全一致。多一个字符或少一个字母、大小写不匹配都会导致配置失败。</li>
  <li><strong>API Key 过期：</strong>如果你在 Agnes 那里重新生成了 Key，记得在 WorkBuddy 里同步更新。旧 Key 会停止工作。</li>
  <li><strong>必填项遗漏：</strong>保存前仔细检查 WorkBuddy 配置表单中的所有必填字段。</li>
</ul>

<h2>测试你的配置</h2>
<p>配置保存后，运行一个简单的测试提示来验证一切是否正常。尝试一个简单查询，例如 "总结这篇文章" 或 "法国的首都是哪里？" 如果你在几秒钟内得到了合理的响应，说明设置成功了。如果遇到错误，首先重新检查模型名称和 API Key——这两个是最常见的出错原因。</h2>

<p>Agnes 确实是一个免费的模型，而且可用性不错。如果你在 WorkBuddy 中需要一个免费的选项，而且可以忍受稍微慢一点的响应速度，那么 Agnes-2.0-flash 值得配置。记住这一点：<strong>模型名称必须是 exactly <code>agnes-2.0-flash</code>——拼写错误的话什么都不会工作。</strong></p>

<script>
// 简单语言切换器
(function(){
  const langSelect = document.getElementById('lang-select');
  const currentPath = window.location.pathname;
  const pathParts = currentPath.split('/');
  const langFromPath = pathParts[1] ? pathParts[1].toLowerCase() : 'en';
  const validLangs = ['en','zh','es','fr','ar','ja','ko','ru','hi'];
  if(langSelect && validLangs.includes(langFromPath)){
    langSelect.value = langFromPath;
  }
  langSelect.addEventListener('change',function(){
    const lang = this.value;
    if(lang !== 'en'){
      const newPath = '/' + lang + currentPath.replace('/'+lang+'/','/').replace('/'+lang+'.html','.html');
      window.location.href = newPath || '/';
    }
  });
})();
</script>




<script id="enhance-js">
(function(){
  var s=document.getElementById('site-search');
  if(!s) return;
  var box=document.getElementById('search-results');
  var pf=null, timer=null;
  function esc(t){return (t||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  s.addEventListener('input',function(){
    var q=s.value.trim();
    clearTimeout(timer);
    if(q.length<2){box.style.display='none';return;}
    timer=setTimeout(function(){
      if(!pf){pf=import('/pagefind/pagefind.js');}
      pf.then(function(m){return m.search(q);})
        .then(function(r){return Promise.all(r.results.slice(0,8).map(function(x){return x.data();}));})
        .then(function(rows){
          if(!rows.length){box.innerHTML='<div style="padding:12px;color:#64748b;font-size:14px;">No results.</div>';box.style.display='block';return;}
          box.innerHTML=rows.map(function(d){
            return '<a href="'+d.url+'">'+esc(d.meta&&d.meta.title||d.url)+'<div class="ex">'+esc(d.excerpt)+'</div></a><hr>';
          }).join('');
          box.style.display='block';
        }).catch(function(){box.style.display='none';});
    },180);
  });
  document.addEventListener('click',function(e){if(e.target!==s&&!box.contains(e.target))box.style.display='none';});
})();
</script>
